{{ define "main" }}
  <section class="section pt-14">
    <div class="container">
      <div class="row justify-center">
        <div class="lg:col-8">
          <h1 class="mb-4">{{ .Title }}</h1>
          {{ with .Params.description }}
            <p class="font-secondary text-text-light dark:text-darkmode-text-light mb-10 text-xl">{{ . }}</p>
          {{ end }}

          {{ $paginator := .Paginate .RegularPages }}
          <div class="border-border dark:border-darkmode-border border-t">
            {{ range $paginator.Pages }}
              {{ partial "post-row" . }}
            {{ else }}
              <p class="py-7">Nothing here yet.</p>
            {{ end }}
          </div>
          {{ partial "components/pagination.html" . }}
        </div>
      </div>
    </div>
  </section>
{{ end }}
