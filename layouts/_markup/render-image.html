{{- /* Markdown images: ![alt](file) — opens in a lightbox on click. */ -}}
{{- $src := .Destination -}}
{{- $res := .Page.Resources.Get (urls.Parse .Destination).Path -}}
{{- with $res }}{{ $src = .RelPermalink }}{{ end -}}
<a href="{{ $src }}" class="glightbox"{{ with .Title }} data-description="{{ . }}"{{ end }}>
  <img src="{{ $src }}" alt="{{ .PlainText }}" loading="lazy"
       {{- with $res }} width="{{ .Width }}" height="{{ .Height }}"{{ end }} />
</a>
